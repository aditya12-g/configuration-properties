server:
  port: 9090

spring:
  application:
    name: 06-api-gateway

  cloud:
    gateway:
      routes:

        - id: auth-service
          uri: lb://05-AUTH-SERVICE
          predicates:
            - Path=/auth/**

        - id: welcome-service
          uri: lb://03-WELCOME-API
          predicates:
            - Path=/welcome/**

        - id: greet-service
          uri: lb://04-GREET-API
          predicates:
            - Path=/greet/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: "*"
